[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tritd-half-unfold"
version = "2.0.0"
description = "Interpretable TriTD-Half TRPCA deep unfolding"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "torch>=2.1",
  "PyYAML>=6.0",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

